name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test · node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['26']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Cambium is zero-dependency (Node v26 runs the TypeScript natively), so there is nothing
      # to install — `npm test` runs `node --test` over the .mjs + native .ts suites directly.
      - name: Test
        run: npm test

      - name: Telegram mobile layout contract
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-family browser is available for the Telegram mobile contract" >&2
            exit 1
          fi
          CHROME_BIN="$browser" npm run proof:tg-mobile-contract

      - name: Standalone audit
        run: npm run standalone:audit

      - name: Standalone smoke
        run: npm run standalone:smoke
