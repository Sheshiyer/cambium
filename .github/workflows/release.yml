name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/cambium-r3f/package-lock.json

      - name: Install retained R3F runtime
        run: npm ci --prefix apps/cambium-r3f

      - name: Resolve Chromium
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-family browser is available" >&2
            exit 1
          fi
          echo "CHROME_BIN=$browser" >> "$GITHUB_ENV"

      - name: Verify deterministic release contract
        run: npm run verify:release

      - name: Live readiness report (separate evidence)
        if: always()
        run: npm run proof:tg-live-readiness

      - name: Upload live readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tg-miniapp-live-readiness-${{ github.sha }}
          path: .artifacts/tg-miniapp-live-proof/readiness.json
          if-no-files-found: error

      - name: Resolve codename
        id: meta
        run: |
          CODENAME="$(node -p "require('./package.json').codename || 'Muse'")"
          printf 'codename=%s\n' "$CODENAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" --title "$TAG · ${{ steps.meta.outputs.codename }}" --generate-notes
          fi
